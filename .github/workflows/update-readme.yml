name: Update recently active projects in README

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch recently active repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = '4nuxd';

            // Get all public, non-fork repos, most recently pushed first
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username,
              type: 'owner',
              sort: 'pushed',
              direction: 'desc',
              per_page: 100
            });

            const eligible = repos.filter(r =>
              !r.fork &&
              !r.private &&
              r.name.toLowerCase() !== username.toLowerCase() // skip the profile repo itself
            );

            const top = eligible.slice(0, 3);

            if (top.length === 0) {
              console.log('No eligible repos found, skipping.');
              return;
            }

            // Featured card for the single most recent repo
            const featured = top[0];
            const fname = featured.name;
            const fdesc = (featured.description || 'No description provided.').trim();
            const flang = featured.language;

            const langBadge = flang
              ? `<img src="https://img.shields.io/badge/${encodeURIComponent(flang)}-3178C6?style=for-the-badge&logo=${encodeURIComponent(flang.toLowerCase())}&logoColor=white"/>\n`
              : '';

            const featuredBlock = `<div align="center">

            <a href="https://github.com/${username}/${fname}">
            <img src="https://github-readme-stats-sigma-two-19.vercel.app/api/pin/?username=${username}&repo=${fname}&hide_border=true&bg_color=0d1117&title_color=ffffff&icon_color=b0b0b0&text_color=c9d1d9&border_color=333333"/>
            </a>

            </div>

            > **${fname}** — ${fdesc}

            <p align="center">
            <img src="https://img.shields.io/github/stars/${username}/${fname}?style=for-the-badge&color=ff5500&label=Stars"/>
            <img src="https://img.shields.io/github/last-commit/${username}/${fname}?style=for-the-badge&color=9f4bff&label=Last%20Commit"/>
            ${langBadge}</p>`;

            // Compact list of the next repos (2nd and 3rd most recent), if any
            let restList = '';
            if (top.length > 1) {
              const rows = top.slice(1).map(r => {
                const d = (r.description || 'No description provided.').trim();
                return `- **[${r.name}](https://github.com/${username}/${r.name})** — ${d}`;
              }).join('\n');
              restList = `\nAlso recently touched:\n${rows}\n`;
            }

            const block = `<!-- LATEST-PROJECT:START (auto-generated, do not edit by hand) -->
            ${featuredBlock}
            ${restList}
            <!-- LATEST-PROJECT:END -->`.replace(/^ {12}/gm, ''); // strip JS indentation

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            const startMarker = '<!-- LATEST-PROJECT:START (auto-generated, do not edit by hand) -->';
            const endMarker = '<!-- LATEST-PROJECT:END -->';
            const startIdx = readme.indexOf(startMarker);
            const endIdx = readme.indexOf(endMarker, startIdx) + endMarker.length;

            if (startIdx === -1 || endIdx === -1) {
              core.setFailed('Could not find LATEST-PROJECT markers in README.md');
              return;
            }

            const updated = readme.slice(0, startIdx) + block + readme.slice(endIdx);

            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
              console.log(`Updated README. Featured: ${fname}`);
            } else {
              console.log('README already up to date.');
            }

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: refresh recently active projects [skip ci]" && git push)
